# Apache minimal de la doublure : mod_rewrite (public/.htaccess actif) + PHP via FastCGI.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common

TypesConfig conf/mime.types
AddType application/manifest+json .webmanifest

# Le docroot est dist/ (résultat de « npm run build »), comme en production ;
# api/ et .env sont ses frères/parents, donc hors webroot.
DocumentRoot "/var/www/html/dist"
DirectoryIndex index.html

<Directory "/var/www/html/dist">
    # AllowOverride All : c'est ce qui rend dist/.htaccess actif, donc testable.
    AllowOverride All
    Require all granted
</Directory>

# Le script est envoyé à PHP-FPM (service « php ») sous le même chemin de montage.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>
