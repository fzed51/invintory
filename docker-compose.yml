# Doublure locale de la production OVH : Apache + PHP-FPM (fpm-fcgi) + MySQL 8.0.
# Le web sert dist/ : lancer « npm run build » avant « docker compose up -d ».
services:
  web:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/web/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      # Même chemin que dans « web » : Apache transmet SCRIPT_FILENAME tel quel à PHP-FPM.
      - .:/var/www/html
    environment:
      # Base de test des suites PHPUnit lancées dans ce conteneur (vue réseau Docker).
      DB_TEST_HOST: db
      DB_TEST_PORT: "3306"
      DB_TEST_USER: ${DB_USER:-invintory}
      DB_TEST_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_TEST_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started

  # Doublure d'auth-service (identifiants réels non reçus, suivi P13) : même contrat que le
  # vrai service, emails consignés, lisibles sur http://localhost:8081/_doublure/emails?a=<adresse>.
  # L'application l'appelle sur http://auth:8081 (AUTH_SERVICE_URL du .env).
  auth:
    build: ./docker/php
    command: ["php", "-S", "0.0.0.0:8081", "/var/www/html/docker/auth-simule/index.php"]
    ports:
      - "8081:8081"
    volumes:
      - .:/var/www/html
    environment:
      AUTH_SIMULE_CLIENT_ID: ${AUTH_CLIENT_ID:-invintory-dev}
      AUTH_SIMULE_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_SIMULE_REDIRECT_URI: http://localhost:8080/api/auth/callback
      AUTH_SIMULE_ISS: http://auth:8081
      AUTH_SIMULE_URL_PUBLIQUE: http://localhost:8081
      AUTH_SIMULE_ETAT: /tmp/auth-simule

  db:
    image: mysql:8.0
    ports:
      # 3306 est souvent déjà pris sur l'hôte.
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-invintory}
      MYSQL_USER: ${DB_USER:-invintory}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
