services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    volumes:
      - .:/app
      - vendor:/app/vendor
      - data:/app/data
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-invintory-dev-secret-change-me-in-production}
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - API_TARGET=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  vendor:
  node_modules:
  data:
